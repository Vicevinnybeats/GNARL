<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GNARL — web demo retired</title>
    <!--  A TOMBSTONE, NOT A REDIRECT.

          The browser demo lived here and was installed to at least one
          home screen, so deleting the path outright turns a real icon on a
          real phone into a 404 with no explanation. A redirect would be
          worse: it would look like the app had moved rather than gone.

          This page also keeps /app/ answering 200 while the old service
          worker unregisters itself. -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        padding: 24px; background: #0a0714; color: #e8e2f5;
        font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      h1 { font-size: 20px; letter-spacing: .12em; margin: 0 0 12px; color: #b98cff; }
      p { margin: 0 0 16px; max-width: 34ch; color: #a99cc4; }
      a { color: #7ce7ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>GNARL</h1>
      <p>
        The browser demo has been retired. GNARL is now a desktop plugin —
        VST3 for Windows and macOS.
      </p>
      <p><a href="/">Back to gnarl</a></p>
    </main>
  </body>
</html>
