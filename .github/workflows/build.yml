name: build

on:
  push:
    branches: ['**']
    # A TAG IS WHAT PUBLISHES. The download button on the site points at
    # /releases/latest, which is a stable URL that needs no GitHub account -
    # unlike a run's artifacts, which expire and are only reachable when
    # signed in. Pushing a `v*` tag runs this same pipeline and, if every
    # platform goes green, attaches the result to a release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: >
          Publish a release at this version (e.g. v0.1.0). Leave empty for
          an ordinary build. The TAG IS CREATED BY THE RELEASE JOB, at the
          commit this run was started from - `gh release create` makes it
          server-side - so publishing needs no tag push and no write access
          to refs beyond the token this workflow already has.
        required: false
        default: ''

concurrency:
  #  A RELEASE RUN GETS ITS OWN GROUP. With the group keyed on the workflow
  #  and the ref alone, a release dispatched on a branch shares a group with
  #  every ordinary push to that branch - so the next commit CANCELS the
  #  publish, which is exactly what happened the first time this was used.
  #  Superseding a build nobody is waiting on is the point of
  #  cancel-in-progress; superseding the one run that produces the artefacts
  #  is not.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || '' }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # pluginval strictness 10 is the bar the prompt pack sets; anything lower
  # lets real host-breaking bugs through.
  PLUGINVAL_STRICTNESS: 10
  # Pinned: the WebView2 SDK is a build dependency of the Windows UI, and an
  # unpinned SDK is an unreproducible build.
  WEBVIEW2_VERSION: 1.0.2903.40

jobs:
  # The web UI is platform independent, so build it once and reuse it. This
  # also keeps a UI-only break from failing two expensive native jobs.
  ui:
    name: web ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Verify the embedded file list matches cmake/WebUI.cmake
        working-directory: ui
        run: |
          set -euo pipefail
          for f in index.html assets/index.js assets/index.css; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gnarl-ui-dist
          path: ui/dist
          retention-days: 7

  # Linux is not a release target, but it builds the engine and runs the whole
  # test suite in about a minute — far faster feedback than waiting on the
  # macOS and Windows runners.
  tests-linux:
    name: tests (linux)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gnarl-ui-dist
          path: ui/dist

      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Cache JUCE and Catch2 checkouts
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: Linux-deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DGNARL_BUILD_TESTS=ON
          -DGNARL_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------
  #  THE BANK, RENDERED, so it can be LISTENED TO without installing
  #  anything. The factory presets are constructed from what the DSP does -
  #  code cannot listen - so the only way anybody finds out that a patch is
  #  wrong is by hearing it, and asking somebody to build the plugin first is
  #  asking them not to bother.
  #
  #  One continuous take of all 150 with an index of timestamps, which is
  #  what a person actually scrubs through. Downloaded from the run's
  #  artifacts.
  audition:
    name: bank audition
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gnarl-ui-dist
          path: ui/dist

      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Cache JUCE and Catch2 checkouts
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: Linux-deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Release, because rendering 150 presets in Debug is roughly fifteen
      # times slower here - the cost is almost entirely juce::dsp::FFT.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGNARL_BUILD_DEMO_RENDERER=ON
          -DGNARL_BUILD_UI=OFF

      - name: Build the renderer
        run: cmake --build build --target GnarlRenderDemo --parallel 4

      - name: Render the bank
        run: ./build/tests/GnarlRenderDemo --audition audition

      - name: Index
        run: cat audition/gnarl-bank-audition.txt

      #  THE SAME BANK AS FILES. The presets are compiled into the binary, so
      #  this is not how they reach the plugin - it is a LIBRARY, to back up,
      #  share, or load on a machine running a different build. The tool
      #  reads every file back and reports how many parse, because writing a
      #  file that does not parse is the one failure here that looks exactly
      #  like success.
      - name: Write the preset library
        run: ./build/tests/GnarlRenderDemo --presets library

      - name: Check the library is complete
        run: |
          set -euo pipefail
          count=$(find library -name '*.gnarl' | wc -l)
          echo "$count preset files"
          test "$count" -eq 150 || { echo "::error::expected 150 presets, got $count"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: gnarl-bank-audition
          path: audition/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: gnarl-presets
          path: library/
          retention-days: 30

  plugin:
    name: ${{ matrix.name }}
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            pluginval_url: https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip
          - name: Windows
            os: windows-2022
            pluginval_url: https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip

    steps:
      - uses: actions/checkout@v4

      # Reuse the UI built in the `ui` job so the two native builds embed a
      # byte-identical bundle.
      - uses: actions/download-artifact@v4
        with:
          name: gnarl-ui-dist
          path: ui/dist

      - name: Cache JUCE and Catch2 checkouts
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Required, not optional: without the WebView2 SDK, JUCE compiles the
      # native-integration API out of WebBrowserComponent and falls back to
      # the IE engine, which cannot run the React UI. See
      # docs/windows-setup.md.
      - name: Install the WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version ${{ env.WEBVIEW2_VERSION }} `
            -OutputDirectory "${{ github.workspace }}/nuget"
          if (-not (Test-Path "${{ github.workspace }}/nuget/Microsoft.Web.WebView2.${{ env.WEBVIEW2_VERSION }}/build/native/include/WebView2.h")) {
            Write-Error "WebView2 SDK headers not found after install"
            exit 1
          }

      # GNARL_BUILD_UI=OFF because the bundle was built in the `ui` job and
      # downloaded above; the CMake UI step would only rebuild it.
      # GNARL_PERSONAL_BUILD: there is no activation server to point at, so
      # without it every download carries a permanent "Development build"
      # banner (CLAUDE.md section 9). Drop this flag the day the plugin is
      # sold rather than used.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DGNARL_BUILD_TESTS=ON
          -DGNARL_BUILD_UI=OFF
          -DGNARL_PERSONAL_BUILD=ON
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/nuget

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Fetch pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL "${{ matrix.pluginval_url }}" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval

      - name: Locate the built VST3
        id: vst3
        shell: bash
        run: |
          set -euo pipefail
          path=$(find build -name 'GNARL.vst3' -maxdepth 8 | head -n 1)
          test -n "$path" || { echo "::error::no VST3 produced"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Found $path"

      - name: pluginval (VST3)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            bin="pluginval/pluginval.app/Contents/MacOS/pluginval"
          else
            bin="pluginval/pluginval.exe"
          fi
          "$bin" --strictness-level "${{ env.PLUGINVAL_STRICTNESS }}" \
                 --validate-in-process \
                 --timeout-ms 600000 \
                 --validate "${{ steps.vst3.outputs.path }}"

      - name: Locate the built AU (macOS)
        id: au
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          path=$(find build -name 'GNARL.component' -maxdepth 8 | head -n 1)
          test -n "$path" || { echo "::error::no AU produced"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # An AU must be installed in the component search path before the system
      # will register it, so validating it in CI needs the copy step below.
      - name: pluginval (AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${{ steps.au.outputs.path }}" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level "${{ env.PLUGINVAL_STRICTNESS }}" \
            --validate-in-process \
            --timeout-ms 600000 \
            --validate ~/Library/Audio/Plug-Ins/Components/GNARL.component

      # A FLAT ARTIFACT, not the build tree. `build/**/GNARL.vst3` zips the
      # plugin inside six levels of CMake scaffolding, which somebody then
      # has to dig through before they can install anything. This produces a
      # folder whose contents go straight where they belong.
      - name: Stage the artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # The standalone IS included, in a folder of its own. It was
          # dropped once on the grounds that a loose GNARL.exe beside the
          # plugin is the file somebody double-clicks by mistake - true, and
          # it is also the only way to hear the thing without a DAW, which
          # matters more while this is being tested. The subfolder is the
          # fix for both: it cannot be mistaken for the plugin, and it is
          # still there when you want it.
          for pattern in GNARL.vst3 GNARL.component; do
            found=$(find build -maxdepth 8 -name "$pattern" -not -path '*/artefacts/*/*/*' 2>/dev/null | head -n 1 || true)

            if [ -n "$found" ]; then
              cp -R "$found" artifacts/ 2>/dev/null || true
              echo "staged $found"
            fi
          done

          # The standalone sits at the ROOT, beside the plugin - not in a
          # subfolder. It was in one briefly, on the theory that a loose
          # GNARL.exe is the file somebody double-clicks by mistake; but
          # this build exists to be tested, and the thing you are going to
          # run first should not be one folder further away than the thing
          # you cannot run at all.
          #
          # Written as an explicit `if` rather than `[ -n "$x" ] && break`,
          # because this step runs under `set -e` and that list exits
          # non-zero on the iterations where the test fails - which kills
          # the step on the very path where nothing was found.
          standalone=""
          for pattern in GNARL.exe GNARL.app GNARL; do
            if [ -z "$standalone" ]; then
              standalone=$(find build -maxdepth 8 -path '*Standalone*' -name "$pattern" 2>/dev/null | head -n 1 || true)
            fi
          done

          if [ -n "$standalone" ]; then
            cp -R "$standalone" artifacts/
            echo "staged standalone $standalone"
          else
            echo "::warning::no Standalone build found - the artifact will have the plugin only"
          fi

          cat > artifacts/INSTALL.txt <<'NOTE'
          GNARL
          =====

          Everything is in this one folder. Nothing here installs itself and
          nothing writes outside it.

            GNARL.exe        the standalone - double-click it, no DAW needed
            GNARL.vst3       the plugin - a FOLDER. Copy the whole folder.
            Presets/         the 150 factory presets as files (see below)
            Bank audition/   all 150 rendered to one .wav, with an index
            INSTALL.txt      this

          BEFORE YOU UNZIP, ON WINDOWS - do this first

            Right-click the .zip > Properties > tick "Unblock" > Apply.

            Windows marks every file downloaded from the internet, and the
            mark is inherited by everything you extract out of the archive.
            This build is UNSIGNED, so with the mark in place Defender can
            quarantine GNARL.exe during extraction - usually with no dialog
            at all. The file is simply not there afterwards, and the zip
            looks like it shipped without it. It did not: GNARL.exe is in
            here, and it is about 9 MB.

            If it has already vanished, open Windows Security > Protection
            history. It will be listed, and you can restore it from there.

          FASTEST WAY TO HEAR IT - no DAW, no install

            Double-click GNARL.exe. Pick an audio device and a MIDI input,
            and play. Nothing is installed and nothing is registered; delete
            the folder and it is gone.

            That is the quickest check that the build works at all. It is
            NOT the plugin - a DAW cannot load an .exe. For that, read on.

          WINDOWS - where the plugin goes. THIS IS THE WHOLE TRICK.

            Copy the GNARL.vst3 FOLDER into

                C:\Program Files\Common Files\VST3\

            so that you end up with

                C:\Program Files\Common Files\VST3\GNARL.vst3\Contents\...

            READ THAT PATH AGAIN. "Common Files" is in the middle of it, and
            it is the part everybody misses.

                C:\Program Files\Common Files\VST3     <- VST3 lives HERE
                C:\Program Files\VSTPlugins            <- this is VST2. NOT here.
                C:\Program Files\Steinberg\VSTPlugins  <- also VST2. NOT here.

            A .vst3 dropped in a VST2 folder is not found, and no amount of
            rescanning changes that: a DAW looks for .dll files in the VST2
            paths and for .vst3 in the VST3 path, and adding a folder to the
            search paths does not make it scan for the other kind.

            That folder needs administrator rights. If Windows refuses the
            paste, that is why - and it is another way this fails quietly.

            GNARL.vst3 is a FOLDER, and that is correct: a VST3 is a
            "bundle", a folder with the binary inside it. Copy the WHOLE
            FOLDER, not its contents. Copying only the inner file is the
            other most common way to get a plugin a DAW cannot find.

          FL STUDIO WILL NOT FIND IT - work through these in order

            1. IS IT IN "Common Files\VST3"? See the path above. This is
               the most common cause by a distance, and the symptom is
               exactly "it is not in the list at all".

            2. RESCAN PROPERLY.
               Options > Manage plugins
               Tick "Rescan previously verified plugins"   <- the important one
               Click "Find more plugins"

               FL caches its scan results per folder. Without that tickbox it
               skips a folder it has seen before, so a plugin added after the
               last scan is never looked at.

            3. LOOK UNDER GENERATORS, NOT EFFECTS. GNARL is a synth.
               Plugin database > Generators > New
               A freshly found plugin lands in "New", not in the alphabetical
               list, until you sort it.

            4. IF YOU PUT IT SOMEWHERE ELSE, TELL FL WHERE.
               Options > Manage plugins > "Plugin search paths" > the folder
               icon > add the folder. VST2 and VST3 paths are the same list,
               but the plugin must actually be in a folder on it.

            5. CHECK THE BITNESS. FL must be the 64-bit build. There is no
               32-bit GNARL and a 32-bit FL will not list it.

            6. STILL NOTHING? Try the single file instead. The subfolder
               "Single file VST3" holds the same plugin as one .vst3 file
               rather than a folder - the same binary, byte for byte. A few
               hosts prefer one form over the other. Copy that file into the
               VST3 folder in place of the GNARL.vst3 FOLDER, and rescan.

               Use one or the other, never both, or the DAW lists GNARL
               twice and you will not know which one you loaded.

            7. IF IT FINDS IT AND THEN FAILS, it is not a scan problem - see
               "IF THE PLUGIN WINDOW IS BLANK" at the bottom.

            ABLETON LIVE
              Preferences > Plug-Ins
              Turn "Use VST3 Plug-In Custom Folder" on, browse to the folder
              you copied GNARL.vst3 into, then click Rescan.
              GNARL appears in Browser > Plug-Ins.

            Reaper, Studio One, Cubase, Bitwig: add the folder to the VST3
            paths in their preferences and rescan. They all work the same
            way, and all of them take the bundle folder.

          macOS

            GNARL.vst3       -> ~/Library/Audio/Plug-Ins/VST3/
            GNARL.component  -> ~/Library/Audio/Plug-Ins/Components/   (AU)
            GNARL.app        -> stays wherever you put it (the standalone)

            These are FOLDERS on macOS and must be copied whole - macOS
            shows them as single items, so dragging does the right thing.
            The two paths are fixed; macOS does not allow a custom VST3
            folder the way Windows does.

            Unsigned, so the first launch needs Finder > right-click > Open
            or the DAW silently will not list it.

          THE 150 FACTORY PRESETS

            They are ALREADY IN THE PLUGIN. There is nothing to install and
            nothing to copy anywhere - open the preset browser and they are
            there.

            The Presets folder is the same 150 as .gnarl files, all in one
            folder, with INDEX.txt naming the category of each. It is there
            so you can back them up, put them on a shared drive, hand one to
            somebody, or open one on a machine running a different build.

          IF THE PLUGIN WINDOW IS BLANK
            The machine is missing the WebView2 runtime. It ships with
            Windows 11 and recent 10, and is a free download from Microsoft
            otherwise. The interface is a web view; without it there is
            nothing to draw with.
          NOTE

          ls -la artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnarl-${{ matrix.name }}
          path: artifacts/
          retention-days: 30

  # ---------------------------------------------------------------------
  #  PUBLISH. Only on a tag, and only after every platform and the test
  #  suite have passed - `needs` is what makes that true, so a tag pushed
  #  onto a red commit produces no release rather than a broken one.
  release:
    name: publish the release
    needs: [plugin, tests-linux, audition]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      # The default token is read-only on this repository; creating a
      # release needs this and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      #  ZIPPED HERE RATHER THAN ATTACHING THE ARTIFACTS AS THEY ARE, for
      #  one reason: a .vst3, a .component and a .app are DIRECTORIES, and
      #  GitHub's own artifact zip flattens the permission bits and the
      #  symlinks inside a macOS bundle. `zip -ry` keeps both, which is the
      #  difference between a bundle macOS will load and one it refuses
      #  without saying why.
      #  ONE DOWNLOAD PER PLATFORM, holding ONE FOLDER.
      #
      #  This was four zips - plugin, presets, audition - and the first thing
      #  that happened is that somebody could not find the standalone. Four
      #  archives means four extractions, four places for a file to end up,
      #  and a user reasonably concluded a build was broken when it was not.
      #  Everything anybody needs is now inside a single `GNARL` folder, so
      #  extracting produces one thing and that thing contains the lot.
      - name: Package
        run: |
          set -euo pipefail
          version="${{ inputs.release_version || github.ref_name }}"
          mkdir -p dist

          for platform in macOS Windows; do
            src="staged/gnarl-${platform}"

            if [ ! -d "$src" ]; then
              echo "::error::no artifact for ${platform} - refusing to publish a partial release"
              exit 1
            fi

            root="assembled/${platform}/GNARL"
            mkdir -p "$root"
            cp -R "$src"/. "$root"/

            #  THE BUNDLE IS THE DEFAULT. A VST3 is specified as a bundle -
            #  a FOLDER named GNARL.vst3 with the binary at
            #  Contents/x86_64-win inside it - and that is the form every
            #  host is required to scan. On Windows the older layout, the
            #  bare DLL named .vst3, is also widely accepted, and an earlier
            #  version of this shipped that at the top on the grounds that
            #  one file is easier to drag than a folder.
            #
            #  That was asserted rather than checked, and it cost somebody a
            #  failed scan in FL Studio. "Easier to copy" is worth nothing
            #  against "might not be found", so the order is now the other
            #  way round: the standard bundle is what sits at the top, and
            #  the single file is the fallback for a host that wants it.
            #
            #  The two binaries are byte-identical - the bundle only adds a
            #  1.4 KB moduleinfo.json - so this is a question of layout and
            #  never of which one works.
            #
            #  macOS has no such choice: the bundle carries Info.plist and a
            #  bare binary is not loadable at all.
            if [ "$platform" = "Windows" ]; then
              inner=$(find "$root/GNARL.vst3" -name '*.vst3' -type f | head -n 1 || true)

              if [ -z "$inner" ]; then
                echo "::error::no VST3 binary inside the Windows bundle"
                exit 1
              fi

              #  Copied out BEFORE anything moves. `$inner` is a path inside
              #  the bundle, so reordering these invalidates it - which a
              #  mock run caught once already.
              mkdir -p "$root/Single file VST3 (only if the folder will not scan)"
              cp "$inner" "$root/Single file VST3 (only if the folder will not scan)/GNARL.vst3"

              #  The bundle stays exactly where it was staged, at the top.
              test -d "$root/GNARL.vst3" \
                || { echo "::error::the top-level VST3 should be the bundle directory"; exit 1; }
              test -f "$root/Single file VST3 (only if the folder will not scan)/GNARL.vst3" \
                || { echo "::error::single-file VST3 missing"; exit 1; }

              echo "bundle at top; single file also provided"
            fi

            #  The presets and the audition go IN the folder, not beside it.
            if [ -d staged/gnarl-presets ]; then
              cp -R staged/gnarl-presets/. "$root"/
            fi

            if [ -d staged/gnarl-bank-audition ]; then
              mkdir -p "$root/Bank audition"
              cp -R staged/gnarl-bank-audition/. "$root/Bank audition"/
            fi

            #  zip -ry, not the artifact zip as it came: a .vst3 bundle, a
            #  .component and a .app are DIRECTORIES, and GitHub's artifact
            #  zip flattens the permission bits and symlinks inside a macOS
            #  bundle. That is the difference between a bundle macOS loads
            #  and one it refuses without saying why.
            (cd "assembled/${platform}" && zip -qry "${GITHUB_WORKSPACE}/dist/GNARL-${version}-${platform}.zip" GNARL)

            echo "--- ${platform} ---"
            find "$root" -maxdepth 1 -printf '%f\n' | sort
          done

          #  The audition ALSO stands alone, because it is 51 MB of audio and
          #  somebody who only wants to hear the bank should not download the
          #  plugin to do it. It is a duplicate, deliberately - the copy
          #  inside the folder is what makes the folder complete.
          if [ -d staged/gnarl-bank-audition ]; then
            (cd staged/gnarl-bank-audition && zip -qry "${GITHUB_WORKSPACE}/dist/GNARL-${version}-bank-audition.zip" .)
          fi

          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.release_version || github.ref_name }}"

          # `--prerelease` for anything carrying a suffix (v0.1.0-beta).
          # /releases/latest SKIPS prereleases, so this is not cosmetic: it
          # decides whether the site's download button points here at all.
          extra=""
          case "$version" in
            *-*) extra="--prerelease" ;;
          esac

          #  THE NOTES LIVE IN A FILE, not in a heredoc here. An
          #  indented heredoc terminator is not a terminator - bash reads to
          #  the end of the script looking for it - and even where it works,
          #  every line arrives with ten leading spaces, which markdown
          #  renders as a code block. A file is also reviewable in a diff.
          # --target pins the tag to THIS run's commit. Without it the tag
          # would be created at the default branch's head, which is not what
          # was built and tested here.
          gh release create "$version" dist/*.zip \
            --target "${GITHUB_SHA}" \
            --title "GNARL $version" \
            --notes-file .github/release-notes.md \
            $extra
