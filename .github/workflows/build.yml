#  Builds the GNARL VST3 on Windows, macOS and Linux.
#
#  THE GUARD RUNS FIRST AND GATES EVERYTHING. It takes seconds, and every
#  check in it is a regression that actually happened during the fork - a
#  platform build that fails twenty minutes in on something the guard would
#  have named in five seconds is twenty minutes nobody gets back.
#
#  WINDOWS AND MACOS ARE ONLY EVER BUILT HERE. The development container is
#  Linux, so these two jobs are the first and only place their project files
#  are exercised. A green Linux job says nothing about them.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_fork.py

  linux:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      #  debian/control's list is incomplete: libcurl4-openssl-dev and
      #  libsecret-1-dev are missing from it, and the second one only fails
      #  at LINK time, after a full compile. libfontconfig1-dev is JUCE 8's:
      #  it asks pkg-config for freetype2 AND fontconfig in one query, so
      #  without fontconfig it loses FreeType's include path too
      #  ("ft2build.h: No such file" while building juceaide).
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-common-dev libasound2-dev libfreetype6-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            freeglut3-dev libjack-jackd2-dev libgl1-mesa-dev libcurl4-openssl-dev libsecret-1-dev \
            libfontconfig1-dev libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build VST3
        run: make vst3 CONFIG=Release -j"$(nproc)"

      - name: Build headless renderer
        run: make headless_server CONFIG=Release -j"$(nproc)"

      #  Compiling is not loading. This does what a DAW's scanner does -
      #  dlopen, ModuleEntry, GetPluginFactory - and fails unless the plugin
      #  answers as GNARL, from Gnarl Audio, with our class IDs.
      - name: Load the VST3 like a host
        run: |
          g++ -std=c++17 -I third_party/VST_SDK/VST3_SDK tools/vst3_probe.cpp -o vst3_probe -ldl
          ./vst3_probe "$PWD/plugin/builds/linux_vst/build/GNARL.vst3/Contents/x86_64-linux/GNARL.so" | tee probe.txt
          grep -q "vendor : Gnarl Audio" probe.txt
          grep -q "476E726C476E7232" probe.txt

      - name: Render the init patch
        run: |
          headless/builds/linux/build/gnarl-render --headless -o init.wav -l 2 -m C3 -b 140
          test -s init.wav

      #  A DAW keys automation lanes by parameter index and ID. The committed
      #  snapshot must stay an exact prefix of the live list: appending is
      #  fine, inserting / renaming / removing moves every lane after it.
      - name: Host parameter order is append-only
        run: |
          ./vst3_probe "$PWD/plugin/builds/linux_vst/build/GNARL.vst3/Contents/x86_64-linux/GNARL.so" --params > params.txt
          python3 tools/check_param_order.py params.txt tests/host_parameters.txt

      #  Renders through the real engine and measures: rates, tempo, transport
      #  lock (with a negative control), bit-identity with the equivalent
      #  matrix connection, and zero depth changing nothing. Then Phase 3's
      #  measuring tool on known signals and GNARL renders (test_measure.py).
      - name: Wobble macro tests
        run: |
          sudo apt-get install -y -qq python3-numpy python3-scipy
          python3 tests/test_wobble.py
          python3 tests/test_measure.py

      #  The vowel buttons produce their vowels (phase2-06-vowel-filter.md);
      #  the drive chain's fold and crush stages (phase2-07-drive-chain.md);
      #  the FM knob and osc FOLD (phase2-08-panel-controls.md).
      #  The clean mono sub (docs/design/phase2-05-mono-sub.md): off changes
      #  nothing, pitch, purity (also under full distortion + OTT), mono,
      #  level, drive, block size - and, through the VST3, a phase reset on
      #  the note's own sample mid-block, which the renderer cannot reach.
      - name: Mono sub, vowel, drive chain and FM tests
        run: |
          python3 tests/test_vowel.py
          python3 tests/test_drive_chain.py
          python3 tests/test_fm.py
          python3 tests/test_sub.py --plugin ./vst3_probe \
            "$PWD/plugin/builds/linux_vst/build/GNARL.vst3/Contents/x86_64-linux/GNARL.so"

      #  The JUCE 8 / CMake renderer (docs/design/phase2-03-juce8.md) must be
      #  sample-for-sample identical to the Projucer / JUCE 6 one: the engine
      #  did not change, so its output may not. Then the wobble and sub tests
      #  again, on the new build. The JUCE 8 plugin embeds the web panel
      #  (ui/), built with npm by CMake (docs/design/phase2-04-web-panel.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JUCE 8 renderer matches JUCE 6
        run: |
          sudo apt-get install -y -qq ninja-build
          cmake -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --target gnarl_render gnarl_plugin_VST3 gnarl_licence_tests
          # The licence policy and client (Phase 7): grace, timeouts, the
          # three-answer contract. No network, no plugin.
          build-cmake/gnarl_licence_tests_artefacts/Release/gnarl_licence_tests
          python3 tools/compare_renders.py headless/builds/linux/build/gnarl-render \
            build-cmake/gnarl_render_artefacts/Release/gnarl-render
          python3 tests/test_wobble.py build-cmake/gnarl_render_artefacts/Release/gnarl-render
          python3 tests/test_vowel.py build-cmake/gnarl_render_artefacts/Release/gnarl-render
          python3 tests/test_drive_chain.py build-cmake/gnarl_render_artefacts/Release/gnarl-render
          python3 tests/test_fm.py build-cmake/gnarl_render_artefacts/Release/gnarl-render
          python3 tests/test_sub.py build-cmake/gnarl_render_artefacts/Release/gnarl-render --plugin ./vst3_probe \
            "$PWD/build-cmake/gnarl_plugin_artefacts/Release/VST3/GNARL.vst3/Contents/x86_64-linux/GNARL.so"

      #  The web panel's bridge against a fake plugin in Chromium: vowel
      #  buttons, filter-model rebinding, and that an idle page sends the
      #  engine nothing (an echo loop once sent 12,000 values a second).
      #  ui/dist and ui/node_modules come from the CMake build above.
      - name: Panel bridge test
        run: |
          cd ui
          npx playwright install --with-deps chromium
          npm test

      #  The mobile version (docs/design/phase2-09-mobile.md): the engine
      #  compiled to WebAssembly with a pinned Emscripten, measured against
      #  gnarl-render, then the phone page with it inside, end to end in
      #  Chromium. The page is uploaded: one HTML file, open it over https.
      - name: Mobile version (engine in WebAssembly)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/build.sh
          python3 tests/test_web.py
          cd ui
          npm run build
          node tests/web.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-mobile-web
          path: ui/dist/gnarl-web.html

      #  The JUCE 8 plugin against the JUCE 6 one, as a host sees them: same
      #  identity and class IDs, the same host parameters in the same order,
      #  and bit-identical audio through the VST3 wrapper - on init and after
      #  the host changes fourteen parameters (the sub among them).
      - name: JUCE 8 plugin matches JUCE 6
        run: |
          python3 tools/compare_plugins.py ./vst3_probe \
            "$PWD/plugin/builds/linux_vst/build/GNARL.vst3/Contents/x86_64-linux/GNARL.so" \
            "$PWD/build-cmake/gnarl_plugin_artefacts/Release/VST3/GNARL.vst3/Contents/x86_64-linux/GNARL.so"

      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-linux-vst3
          path: plugin/builds/linux_vst/build/GNARL.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: gnarl-render-linux
          path: |
            headless/builds/linux/build/gnarl-render
            init.wav

  #  The JUCE 8 VST3 (CMakeLists.txt, docs/design/phase2-03-juce8.md) on
  #  Windows and macOS, beside the Projucer builds that still ship. Linux
  #  proves it identical to JUCE 6; these prove it builds, and produce the
  #  binaries to load in FL Studio and Ableton.
  #  The licence service (backend/): activation, and payments - Stripe's
  #  webhook issuing keys, refunds, the thank-you page's lookup. In workerd
  #  against a local D1, so the real handler and the real SQL.
  backend:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Licence service tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npm test

  windows-juce8:
    needs: guard
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      #  The JUCE 8 plugin embeds the web panel (ui/), built with npm by
      #  CMake (docs/design/phase2-04-web-panel.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      #  JUCE links WebView2's loader statically, from the NuGet package;
      #  pinned, so a new SDK cannot change the build under us. Users need
      #  the WebView2 RUNTIME, which Windows 11 and updated Windows 10 have.
      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$env:RUNNER_TEMP\nuget"
          if ($LASTEXITCODE -ne 0) { throw "nuget failed" }
      - name: Build VST3 (CMake, JUCE 8)
        shell: pwsh
        run: |
          cmake -B build-cmake -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\nuget"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build-cmake --config Release --target gnarl_plugin_VST3 -- /m /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-windows-vst3-juce8
          path: build-cmake/gnarl_plugin_artefacts/Release/VST3/GNARL.vst3

  macos-juce8:
    needs: guard
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      #  The JUCE 8 plugin embeds the web panel (ui/), built with npm by
      #  CMake (docs/design/phase2-04-web-panel.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      #  Unsigned, universal (arm64 + x86_64), as the Projucer job.
      - name: Build VST3 (CMake, JUCE 8)
        run: |
          set -o pipefail
          cmake -B build-cmake -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-cmake --config Release --target gnarl_plugin_VST3 2>&1 | tail -60
          b=build-cmake/gnarl_plugin_artefacts/Release/VST3/GNARL.vst3
          test -d "$b"
          lipo -info "$b/Contents/MacOS/GNARL"
      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-macos-vst3-juce8
          path: build-cmake/gnarl_plugin_artefacts/Release/VST3/GNARL.vst3

  windows:
    needs: guard
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      #  The projects were generated for Visual Studio 2017 (toolset v141),
      #  which this runner does not have; v143 is VS2022's.
      #
      #  Built as two PROJECTS, not as a solution target. The first attempt
      #  asked the solution for /t:"GNARL_-_VST3", guessing how MSBuild
      #  mangles "GNARL - VST3" into a target name, and got MSB4057. Both
      #  projects locate each other through $(SolutionDir) - the VST3 links
      #  GNARL.lib out of $(SolutionDir)x64\Release\Shared Code - so passing
      #  it explicitly is all the solution was contributing.
      #  The VST2 target is never built: its SDK is no longer distributed.
      #
      #  PostBuildEventUseInBuild=false: upstream's post-build step copies
      #  the plugin into %CommonProgramW6432%\VST3, which does not exist on a
      #  runner, and `copy` does not create folders - MSB3073 after a
      #  successful compile AND link. On a producer's machine that folder
      #  exists and the copy is exactly where FL Studio scans, so the project
      #  keeps it; only CI skips it. Same family as macOS's DSTROOT = /.
      - name: Build VST3
        shell: pwsh
        run: |
          $sd = "$PWD\plugin\builds\vs17\"
          foreach ($proj in 'GNARL_SharedCode', 'GNARL_VST3') {
            msbuild "plugin/builds/vs17/$proj.vcxproj" `
              /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 `
              "/p:SolutionDir=$sd" /p:PostBuildEventUseInBuild=false `
              /m /nologo /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { throw "$proj failed" }
          }

      #  JUCE 6.0 writes the Windows VST3 as a single DLL named GNARL.vst3,
      #  not a bundle folder, so this accepts either.
      - name: Locate the plugin
        id: find
        shell: pwsh
        run: |
          $b = Get-ChildItem -Recurse -Filter GNARL.vst3 plugin/builds/vs17 | Select-Object -First 1
          if (-not $b) { throw "GNARL.vst3 was not produced" }
          "path=$($b.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-windows-vst3
          path: ${{ steps.find.outputs.path }}

  macos:
    needs: guard
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      #  ARCHS is overridden: the project asks for arm64e as well, which is
      #  Apple's pointer-authentication ABI and is not supported for
      #  third-party code - hosts do not load it. arm64 + x86_64 is the
      #  universal binary that actually runs everywhere.
      #  Unsigned: signing and notarisation need an Apple Developer account.
      #  DEPLOYMENT_LOCATION=NO: the project installs straight into
      #  ~/Library/Audio/Plug-Ins with DSTROOT = /, and Xcode 15's build
      #  system then treats the filesystem root as a build directory that
      #  contains its own output - "Cycle inside a single target", with
      #  `CreateBuildDirectory /` in the trace. Off, the bundle lands in
      #  plugin/builds/osx/build/Release, which is all CI wants anyway.
      #
      #  stderr is merged into the tail. The first run exited 74 with
      #  NOTHING in the log, because xcodebuild reports a damaged project on
      #  stderr and only stdout was being piped.
      - name: Build VST3
        run: |
          set -o pipefail
          xcodebuild -project plugin/builds/osx/GNARL.xcodeproj \
            -target "GNARL - VST3" -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            DEPLOYMENT_LOCATION=NO 2>&1 | tail -60

      - name: Locate the bundle
        id: find
        run: |
          b=$(find plugin/builds/osx -type d -name GNARL.vst3 | head -1)
          test -n "$b" || { echo "GNARL.vst3 was not produced"; exit 1; }
          lipo -info "$b/Contents/MacOS/GNARL"
          echo "path=$b" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GNARL-macos-vst3
          path: ${{ steps.find.outputs.path }}
